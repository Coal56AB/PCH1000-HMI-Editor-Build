plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.15.0'
}

android {
    namespace 'com.pch1000.hmieditor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pch1000.hmieditor'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.2.3'
        // Public app identifier, never a token or client secret.
        def oauthClientId = providers.gradleProperty('githubOAuthClientId').orElse(providers.environmentVariable('GITHUB_OAUTH_CLIENT_ID')).getOrElse('Ov23liZhW4JlhvBxx6zs')
        if (!(oauthClientId ==~ /[A-Za-z0-9.\-]*/)) {
            throw new GradleException('Invalid GitHub OAuth Client ID')
        }
        buildConfigField 'String', 'GITHUB_OAUTH_CLIENT_ID', '"' + oauthClientId + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
