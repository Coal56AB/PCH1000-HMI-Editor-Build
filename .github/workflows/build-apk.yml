name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node --check app/src/main/assets/editor/editor.js
      - run: node --check app/src/main/assets/editor/app-shell.js
      - run: node tests/check_editor.mjs
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PCH1000-HMI-Editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
