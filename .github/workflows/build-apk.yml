name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: node --check app/src/main/assets/editor/editor.js
      - run: node --check app/src/main/assets/editor/app-shell.js
      - run: node tests/check_editor.mjs
      - run: node tests/check_geometry.mjs
      - run: node tests/check_export.mjs
      - run: python3 tests/check_signing.py
      - run: node tests/check_github_auth.mjs
      - name: Test GitHub device authorization recovery
        run: |
          javac -encoding UTF-8 -d /tmp/pch-auth-tests app/src/main/java/com/pch1000/hmieditor/GitHubDevicePoller.java tests/GitHubDevicePollerTest.java
          java -cp /tmp/pch-auth-tests com.pch1000.hmieditor.GitHubDevicePollerTest
      - name: Restore the permanent signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PCH1000_SIGNING_BUNDLE: ${{ secrets.PCH1000_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py
      - name: Build signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: gradle assembleRelease
      - name: Verify the permanent APK signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/verify_apk_signing.py
      - name: Check rejection of wrong certificate and damaged APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tests/check_apk_verification.py
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: PCH1000-HMI-Editor-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Build isolated development APK
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: gradle assembleDebug
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pch1000-signing.p12"

  release:
    name: Publish current APK and complete sources
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: pch1000-publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Download APK from this successful build
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const result = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            const artifact = result.data.artifacts.find(a => a.name === 'PCH1000-HMI-Editor-release');
            if (!artifact || artifact.expired) throw new Error('APK artifact missing');
            const response = await github.rest.actions.downloadArtifact({...context.repo, artifact_id: artifact.id, archive_format: 'zip'});
            fs.writeFileSync('built-apk.zip', Buffer.from(response.data));
      - name: Prepare release
        run: |
          python3 - <<'PYCODE'
          import re, pathlib
          text = pathlib.Path('app/build.gradle').read_text()
          version = re.search(r"versionName '([0-9]+[.][0-9]+[.][0-9]+)'", text).group(1)
          pathlib.Path('release-version.txt').write_text(version)
          PYCODE
          version="$(cat release-version.txt)"
          mkdir release-files
          unzip -p built-apk.zip app-release.apk > "release-files/PCH1000_HMI_Editor_v${version}.apk"
          test -s "release-files/PCH1000_HMI_Editor_v${version}.apk"
          git archive --format=zip HEAD -o "release-files/PCH1000_HMI_Editor_v${version}_full.zip"
          cd release-files
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish a new version once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          version="$(cat release-version.txt)"
          tag="v${version}"
          if gh release view "$tag" --json isDraft --jq .isDraft > existing-release.txt; then
            if test "$(cat existing-release.txt)" = false; then
              echo "This version is already published; its APK will not be replaced."
              exit 0
            fi
            echo "An unfinished draft already exists. Inspect it before publishing."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Настроена постоянная подпись APK. Новые релизы используют один сохранённый ключ; отсутствие или подмена ключа останавливают сборку и публикацию.

          После перехода на эту версию последующие обновления устанавливаются поверх неё через кнопку обновления приложения, с подтверждением Android и сохранением данных.
          Переход с прежних debug-сборок однократный: их ключи не были сохранены, поэтому Android не позволит установить эту версию поверх них. Сохраните проекты перед переустановкой.

          APK и полные исходники относятся к одному коммиту. Закрытый ключ в исходники и релиз не включён.
          NOTES
          gh release create "$tag" release-files/* --target "$RELEASE_TARGET" --title "PCH1000 HMI Editor $version" --notes-file release-notes.md --draft
          gh release edit "$tag" --draft=false --latest
