name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: node --check app/src/main/assets/editor/editor.js
      - run: node --check app/src/main/assets/editor/app-shell.js
      - run: node --check app/src/main/assets/editor/codex-questions.js
      - run: node tests/check_codex_questions.mjs
      - run: node tests/check_codex_edits.mjs
      - run: python3 tests/check_release_version.py
      - run: node tests/check_release_publish.mjs
      - run: node tests/check_live_overrides.mjs
      - run: node tests/check_editor.mjs
      - run: node tests/check_geometry.mjs
      - run: node tests/check_export.mjs
      - run: python3 tests/check_signing.py
      - run: node tests/check_github_auth.mjs
      - name: Test GitHub device authorization recovery
        run: |
          javac -encoding UTF-8 -d /tmp/pch-auth-tests app/src/main/java/com/pch1000/hmieditor/GitHubDevicePoller.java tests/GitHubDevicePollerTest.java
          java -cp /tmp/pch-auth-tests com.pch1000.hmieditor.GitHubDevicePollerTest
      - name: Set the version for this main commit
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/prepare_release.py stamp
      - name: Restore the permanent signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PCH1000_SIGNING_BUNDLE: ${{ secrets.PCH1000_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py
      - name: Build signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: gradle assembleRelease
      - name: Verify the permanent APK signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/verify_apk_signing.py
      - name: Check rejection of wrong certificate and damaged APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 tests/check_apk_verification.py
      - name: Verify APK version and package complete release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/prepare_release.py package
      - uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: PCH1000-HMI-Editor-release
          path: release-files/
          if-no-files-found: error
      - name: Build isolated development APK
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: gradle assembleDebug
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pch1000-signing.p12"

  release:
    name: Publish current APK and complete sources
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: pch1000-publish-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v5
      - name: Download the verified release from this successful build
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const result = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: context.runId});
            const artifact = result.data.artifacts.find(a => a.name === 'PCH1000-HMI-Editor-release');
            if (!artifact || artifact.expired) throw new Error('Release artifact missing');
            const response = await github.rest.actions.downloadArtifact({...context.repo, artifact_id: artifact.id, archive_format: 'zip'});
            fs.writeFileSync('built-release.zip', Buffer.from(response.data));
      - run: unzip -q built-release.zip -d release-files
      - name: Publish or resume the release for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./scripts/publish_release.cjs');
            await publish({github, context, core});
